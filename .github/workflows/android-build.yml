name: Android Virtual Sandbox Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "cmake;3.22.1" || true
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
